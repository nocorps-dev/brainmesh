services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brainmesh
      POSTGRES_PASSWORD: brainmesh_dev_password
      POSTGRES_DB: brainmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainmesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  brainmesh:
    build: .
    ports:
      - "8080:8080"
    environment:
      BRAINMESH_DATABASE_URL: sqlite:///data/brainmesh.db?mode=rwc
    volumes:
      - brainmesh_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  brainmesh_data:
